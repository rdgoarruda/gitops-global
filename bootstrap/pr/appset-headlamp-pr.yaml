apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headlamp-ingress-pr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: infra-placement-pr
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'headlamp-ingress-{{clusterName}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/rdgoarruda/gitops-global.git'
        targetRevision: main
        path: 'infrastructure/headlamp/overlays/{{clusterName}}'
      destination:
        name: '{{clusterName}}'
        namespace: headlamp
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
