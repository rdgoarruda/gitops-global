# ATO 1 — Alguém tenta virar admin do cluster
# Detecta ClusterRoleBindings apontando para cluster-admin criados fora do sistema
# Modo: enforce — remove bindings não autorizados
# Allowlist:
#   - system:* / cluster-admin / kubeadm:cluster-admins  (sistema)
#   - headlamp-*-admin  com SA 'headlamp-*' no ns headlamp (token manual headlamp por BU)
#   - headlamp-admin    com SA 'headlamp' no ns headlamp    (helm chart headlamp)
#
# NOTA: $.ManagedClusterName não está disponível no contexto do managed cluster.
# Usamos hasPrefix + validação de subject como alternativa portável.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-restrict-clusteradmin
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-restrict-clusteradmin
        spec:
          remediationAction: enforce
          severity: critical
          object-templates-raw: |
            {{- range $crb := (lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" "").items }}
            {{- $isAllowed := false }}
            {{- if or (hasPrefix "system:" $crb.metadata.name) (eq $crb.metadata.name "cluster-admin") (eq $crb.metadata.name "kubeadm:cluster-admins") }}
              {{- $isAllowed = true }}
            {{- else if eq $crb.metadata.name "headlamp-admin" }}
              {{- $isAllowed = true }}
              {{- range $subj := $crb.subjects }}
                {{- if or (ne $subj.kind "ServiceAccount") (ne $subj.namespace "headlamp") (ne $subj.name "headlamp") }}
                  {{- $isAllowed = false }}
                {{- end }}
              {{- end }}
              {{- if ne (len $crb.subjects) 1 }}
                {{- $isAllowed = false }}
              {{- end }}
            {{- else if and (hasPrefix "headlamp-" $crb.metadata.name) (hasSuffix "-admin" $crb.metadata.name) }}
              {{- $saName := trimSuffix "-admin" $crb.metadata.name }}
              {{- $isAllowed = true }}
              {{- range $subj := $crb.subjects }}
                {{- if or (ne $subj.kind "ServiceAccount") (ne $subj.namespace "headlamp") (ne $subj.name $saName) }}
                  {{- $isAllowed = false }}
                {{- end }}
              {{- end }}
              {{- if ne (len $crb.subjects) 1 }}
                {{- $isAllowed = false }}
              {{- end }}
            {{- end }}
            {{- if and (eq $crb.roleRef.name "cluster-admin") (not $isAllowed) }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: {{ $crb.metadata.name }}
            {{- end }}
            {{- end }}
