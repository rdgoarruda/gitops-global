# ATO 2 — Container com acesso total ao nó
# Bloqueia qualquer Pod rodando com securityContext.privileged: true
# remediationAction: enforce → o agente corrige sozinho, sem intervenção humana
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-no-privileged-pods
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-no-privileged-pods
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include: ["*"]
            exclude:
              - kube-system
              - open-cluster-management*
              - haproxy-controller
          object-templates-raw: |
            {{- range $pod := (lookup "v1" "Pod" "" "").items }}
            {{- $exclude := false }}
            {{- if or (eq $pod.metadata.namespace "kube-system") (hasPrefix "open-cluster-management" $pod.metadata.namespace) (eq $pod.metadata.namespace "haproxy-controller") }}
            {{- $exclude = true }}
            {{- end }}
            {{- if not $exclude }}
            {{- $isPrivileged := false }}
            {{- range $container := $pod.spec.containers }}
            {{- if $container.securityContext }}
            {{- if eq $container.securityContext.privileged true }}
            {{- $isPrivileged = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $isPrivileged }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: Pod
                metadata:
                  name: {{ $pod.metadata.name }}
                  namespace: {{ $pod.metadata.namespace }}
            {{- end }}
            {{- end }}
            {{- end }}
