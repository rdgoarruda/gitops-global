# Garante que o HAProxy Ingress Controller está instalado em cada cluster worker
# DaemonSet com hostNetwork: true para capturar tráfego de entrada nos nodes
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-haproxy-ingress
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-haproxy-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: haproxy-controller
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-haproxy-daemonset
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: DaemonSet
                metadata:
                  name: haproxy-ingress
                  namespace: haproxy-controller
                spec:
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: haproxy-ingress
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/name: haproxy-ingress
                    spec:
                      hostNetwork: true
                      serviceAccountName: haproxy-ingress
                      containers:
                        - name: haproxy-ingress
                          image: haproxytech/kubernetes-ingress:1.10
                          args:
                            - --configmap=haproxy-controller/haproxy-ingress
                            - --default-backend-service=haproxy-controller/ingress-default-backend
                          ports:
                            - name: http
                              containerPort: 80
                              hostPort: 80
                            - name: https
                              containerPort: 443
                              hostPort: 443
                          resources:
                            requests:
                              cpu: 100m
                              memory: 128Mi
                            limits:
                              cpu: 500m
                              memory: 512Mi
